<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
<!-- Hotjar Tracking Code for https://www.impossiblemotion.io/ -->
<script>
    (function(h,o,t,j,a,r){
        h.hj=h.hj||function(){(h.hj.q=h.hj.q||[]).push(arguments)};
        h._hjSettings={hjid:5098720,hjsv:6};
        a=o.getElementsByTagName('head')[0];
        r=o.createElement('script');r.async=1;
        r.src=t+h._hjSettings.hjid+j+h._hjSettings.hjsv;
        a.appendChild(r);
    })(window,document,'https://static.hotjar.com/c/hotjar-','.js?sv=');
</script>
    <title>Spatial Video Demo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
      body {
        overflow: hidden;
        margin: 0;
        height: 100vh;
        width: 100vw;
        font-family: sans-serif;
        background: black;
        text-shadow: 0 0 3px black;
      }

    .impossible-motion-text {
      font-family: 'Space Mono', monospace;
      color: white;
      font-size: 24px;
      position: absolute;
      bottom: 30vh;
      top: auto;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      z-index: 101;
      text-align: center;
    }
      a,
      body {
        color: white;
      }
      #info {
        z-index: 100;
        position: absolute;
        top: 10px;
        left: 15px;
      }
      h3 {
        margin: 5px 0;
      }
      p {
        margin: 5px 0;
        font-size: small;
      }

      .cube-wrapper {
        transform-style: preserve-3d;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 80px;
        height: auto;
      }

      .cube {
        transform-style: preserve-3d;
        transform: rotateX(45deg) rotateZ(45deg);
        animation: rotation 2s infinite;
      }

      .cube-faces {
        transform-style: preserve-3d;
        height: 80px;
        width: 80px;
        position: relative;
        transform-origin: 0 0;
        transform: translateX(0) translateY(0) translateZ(-40px);
      }

      .cube-face {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.1);
        border: solid 1px rgba(255, 255, 255, 0.5);
        box-shadow: 0 0 10px 5px rgba(255, 255, 255, 0.2);
      }

      .cube-face.top {
        transform: translateZ(80px);
      }
      .cube-face.front {
        transform-origin: 0 50%;
        transform: rotateY(-90deg);
      }
      .cube-face.back {
        transform-origin: 0 50%;
        transform: rotateY(-90deg) translateZ(-80px);
      }
      .cube-face.right {
        transform-origin: 50% 0;
        transform: rotateX(-90deg) translateY(-80px);
      }
      .cube-face.left {
        transform-origin: 50% 0;
        transform: rotateX(-90deg) translateY(-80px) translateZ(80px);
      }

      @keyframes rotation {
        0% {
          transform: rotateX(45deg) rotateY(0) rotateZ(45deg);
          animation-timing-function: cubic-bezier(0.17, 0.84, 0.44, 1);
        }
        50% {
          transform: rotateX(45deg) rotateY(0) rotateZ(225deg);
          animation-timing-function: cubic-bezier(0.76, 0.05, 0.86, 0.06);
        }
        100% {
          transform: rotateX(45deg) rotateY(0) rotateZ(405deg);
          animation-timing-function: cubic-bezier(0.17, 0.84, 0.44, 1);
        }
      }

      .scene,
      #message {
        position: absolute;
        display: flex;
        top: 0;
        right: 0;
        left: 0;
        bottom: 0;
        z-index: 2;
        height: 100%;
        width: 100%;
        align-items: center;
        justify-content: center;
      }
      #message {
        font-weight: bold;
        font-size: large;
        color: red;
        pointer-events: none;
      }

      details {
        font-size: small;
      }

      #progress {
        position: absolute;
        top: 0;
        height: 5px;
        background: blue;
        z-index: 99;
        transition: width 0.1s ease-in-out;
      }

      #quality {
        position: absolute;
        bottom: 10px;
        z-index: 999;
        right: 10px;
      }

      #caminfo {
        position: absolute;
        top: 10px;
        z-index: 999;
        right: 10px;
      }
      #canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #instructions {
        background: rgba(0, 0, 0, 0.6);
        white-space: pre-wrap;
        padding: 10px;
        border-radius: 10px;
        font-size: x-small;
      }
      body.nohf .nohf {
        display: none;
      }
      body.nohf #progress,
      body.nohf .cube-face {
        background: #000000;
      }
      #enter {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10000;
        padding: 10px;
        display: none;
      }
      #player-controls {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 50%;
        height: 40px;
        background-color: rgba(0, 0, 0, 0.7);
        border-radius: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 1000;
      }
      #pausePlay {
        background: none;
        border: none;
        cursor: pointer;
        padding: 10px;
      }
      #pausePlay:focus {
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <p></p>
    </div>
    <div id="progress"></div>

    <div id="message"></div>
    <div class="scene" id="spinner">
      <div class="cube-wrapper">
        <div class="cube">
          <div class="cube-faces">
            <div class="cube-face bottom"></div>
            <div class="cube-face top"></div>
            <div class="cube-face left"></div>
            <div class="cube-face right"></div>
            <div class="cube-face back"></div>
            <div class="cube-face front"></div>
          </div>
        </div>
      </div>
      <div class="impossible-motion-text">Impossible Motion</div>
    </div>
    <canvas id="canvas"></canvas>
    <div id="player-controls">
      <button id="pausePlay">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <path id="playPauseIcon" fill="white" d="M5,5.14V19.14H9V5.14H5M15,5.14V19.14H19V5.14H15Z" />
        </svg>
      </button>
    </div>

    <div id="quality">
      <span id="fps"></span>
    </div>
    <div id="caminfo">
      <span id="camid"></span>
    </div>

    <script src="hybrid.js"></script>
  </body>
</html>
